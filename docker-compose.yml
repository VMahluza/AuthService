services:
  mysql:
    image: mysql:8.0
    container_name: mysql8-authservice
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: authpassword
      MYSQL_DATABASE: authservice_db
      MYSQL_USER: jimmy
      MYSQL_PASSWORD: authpassword
    ports:
      - "3306:3306"
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--mysqlx=0"
    ]
    volumes:
      - dbdata:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - civic-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 3s
      retries: 10

volumes:
  dbdata:

networks:
  civic-network:
    driver: bridge